<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CS2 Mobile Arena 3D</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#101820;color:white;font-family:Arial;
 touch-action:none;
}
canvas{display:block}
#hud{
 position:fixed;top:10px;left:10px;z-index:3;
 display:flex;gap:6px;pointer-events:none;
}
.stat{
 background:#101923dd;border:1px solid #526778;
 border-radius:7px;padding:8px;font-size:12px;
}
#crosshair{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 color:#00ff99;font-size:26px;z-index:2;
 pointer-events:none;
}
#bottom{
 position:fixed;bottom:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;
 align-items:end;z-index:3;pointer-events:none;
}
#healthBar{
 width:120px;height:11px;background:#333;
 border-radius:8px;overflow:hidden;margin-top:5px;
}
#healthFill{height:100%;width:100%;background:#00e88c}
#ammo{font-size:20px;font-weight:bold}
#mobile{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}
#lookArea{
 position:absolute;right:0;top:0;
 width:58%;height:72%;
 pointer-events:auto;touch-action:none;
}
#joystick{
 position:absolute;left:20px;bottom:65px;
 width:120px;height:120px;border-radius:50%;
 background:#ffffff25;border:2px solid #ffffff80;
 pointer-events:auto;touch-action:none;
}
#stick{
 position:absolute;left:35px;top:35px;
 width:46px;height:46px;border-radius:50%;
 background:#00ee99;
}
#buttons{
 position:absolute;right:12px;bottom:45px;
 display:grid;grid-template-columns:repeat(2,65px);
 gap:8px;pointer-events:auto;
}
.control{
 width:65px;height:60px;border-radius:50%;
 border:2px solid #ffffff90;
 background:#152b3bdd;color:white;
 font-size:11px;font-weight:bold;
 touch-action:none;
}
#fire{background:#bd3434}
#knife{background:#075e73}
#jump{background:#394b7c}
#menu{
 position:fixed;inset:0;z-index:10;
 background:#08111bed;
 display:flex;align-items:center;justify-content:center;
 text-align:center;padding:18px;
}
.panel{
 width:min(420px,95%);padding:25px 20px;
 border:1px solid #496276;
 border-radius:15px;background:#142332;
}
h1{color:#00ff99;font-size:27px}
.panel p{line-height:1.7;color:#d0dbe3;font-size:14px}
#start{
 background:#00ee99;border:0;border-radius:8px;
 padding:15px 35px;font-size:17px;
 font-weight:bold;color:#07130e;
}
#message{
 position:fixed;top:85px;left:0;width:100%;
 text-align:center;color:#00ff99;
 font-weight:bold;z-index:3;pointer-events:none;
}
@media(pointer:coarse){
 #mobile{display:block}
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>
</head>

<body>

<div id="hud">
 <div class="stat">HP: <b id="hp">100</b></div>
 <div class="stat">KILLS: <b id="kills">0</b></div>
 <div class="stat">SCORE: <b id="score">0</b></div>
 <div class="stat">BOTS: <b id="bots">5</b></div>
</div>

<div id="crosshair">+</div>
<div id="message"></div>

<div id="bottom">
 <div>
  <b>HEALTH</b>
  <div id="healthBar"><div id="healthFill"></div></div>
 </div>
 <div id="ammo">30 / 120</div>
</div>

<div id="mobile">
 <div id="lookArea"></div>
 <div id="joystick"><div id="stick"></div></div>
 <div id="buttons">
  <button class="control" id="fire">FIRE</button>
  <button class="control" id="knife">KNIFE</button>
  <button class="control" id="jump">JUMP</button>
  <button class="control" id="rifle">RIFLE</button>
  <button class="control" id="reload">RELOAD</button>
 </div>
</div>

<div id="menu">
 <div class="panel">
  <h1>CS2 MOBILE ARENA</h1>
  <p>
   3D MOBILE SHOOTER<br>
   5 ta bot bilan arena mashqi<br><br>
   JOYSTICK — yurish<br>
   EKRAN — atrofga qarash<br>
   FIRE — nishonga olish va otish
  </p>
  <button id="start">START GAME</button>
 </div>
</div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
let scene,camera,renderer;
let running=false;
let yaw=0,pitch=0;
let kills=0,score=0;
let ammo=30,reserve=120;
let reloading=false;
let velocityY=0;
let onGround=true;
let joyX=0,joyY=0;
let keys={};
let bots=[];
let lastShot=0;

const raycaster=new THREE.Raycaster();
const clock=new THREE.Clock();

function init(){

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x8499a5);
 scene.fog=new THREE.Fog(0x8499a5,25,65);

 camera=new THREE.PerspectiveCamera(
  75,innerWidth/innerHeight,0.1,100
 );
 camera.position.set(0,1.7,8);

 renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
 });
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=false;
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));

 const light=new THREE.DirectionalLight(0xffffff,1.4);
 light.position.set(5,12,5);
 scene.add(light);

 // Ground
 const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  new THREE.MeshStandardMaterial({color:0x66736a})
 );
 floor.rotation.x=-Math.PI/2;
 scene.add(floor);

 // Arena floor lines
 for(let i=-20;i<=20;i+=4){
  const line=new THREE.Mesh(
   new THREE.BoxGeometry(0.035,0.02,40),
   new THREE.MeshBasicMaterial({color:0x89958a})
  );
  line.position.set(i,0.015,0);
  scene.add(line);
 }

 // Walls
 function wall(x,y,z,w,h,d,color){
  const m=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   new THREE.MeshStandardMaterial({color})
  );
  m.position.set(x,y,z);
  scene.add(m);
 }

 wall(0,2,-20,42,4,1,0x596b76);
 wall(0,2,20,42,4,1,0x596b76);
 wall(-20,2,0,1,4,40,0x596b76);
 wall(20,2,0,1,4,40,0x596b76);

 // Obstacles
 for(let i=0;i<8;i++){
  let x=(Math.random()-.5)*25;
  let z=(Math.random()-.5)*25;
  if(Math.abs(z-8)<5)z-=7;
  wall(x,.8,z,2,1.6,2,0x8b7558);
 }

 // Simple weapon model
 const gun=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.18,.15,.65),
  new THREE.MeshStandardMaterial({color:0x222831})
 );
 body.position.set(.35,-.3,-.65);
 gun.add(body);

 const barrel=new THREE.Mesh(
  new THREE.CylinderGeometry(.035,.035,.4,8),
  new THREE.MeshStandardMaterial({color:0x555555})
 );
 barrel.rotation.x=Math.PI/2;
 barrel.position.set(.35,-.27,-1.05);
 gun.add(barrel);

 camera.add(gun);
 scene.add(camera);

 // Bots
 for(let i=0;i<5;i++)spawnBot();

 animate();
}

function spawnBot(){
 const group=new THREE.Group();

 const material=new THREE.MeshStandardMaterial({
  color:0xc34a35
 });

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.65,1,.35),material
 );
 body.position.y=1.15;
 group.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.25,10,8),
  new THREE.MeshStandardMaterial({color:0xd4a17d})
 );
 head.position.y=1.85;
 group.add(head);

 const legsMat=new THREE.MeshStandardMaterial({color:0x27354a});

 for(let x of [-.18,.18]){
  const leg=new THREE.Mesh(
   new THREE.BoxGeometry(.2,.65,.25),legsMat
  );
  leg.position.set(x,.35,0);
  group.add(leg);
 }

 let x,z;
 do{
  x=(Math.random()-.5)*27;
  z=(Math.random()-.5)*27;
 }while(Math.hypot(x-camera.position.x,z-camera.position.z)<7);

 group.position.set(x,0,z);
 group.userData.isBot=true;

 scene.add(group);
 bots.push(group);
 updateHUD();
}

function updateHUD(){
 $('hp').textContent='100';
 $('kills').textContent=kills;
 $('score').textContent=score;
 $('bots').textContent=bots.length;
 $('ammo').textContent=ammo+' / '+reserve;
}

function shoot(){
 if(!running || reloading)return;

 if(ammo<=0){
  $('message').textContent='RELOAD!';
  return;
 }

 const now=performance.now();
 if(now-lastShot<180)return;
 lastShot=now;

 ammo--;
 updateHUD();

 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);

 const objects=[];
 bots.forEach(b=>b.traverse(o=>{
  if(o.isMesh)objects.push(o);
 }));

 const hits=raycaster.intersectObjects(objects);

 if(hits.length){
  let target=hits[0].object;
  while(target.parent && !target.userData.isBot){
   target=target.parent;
  }
  if(target.userData.isBot){
   scene.remove(target);
   bots=bots.filter(b=>b!==target);
   kills++;
   score+=100;
   $('message').textContent='BOT HIT! +100';

   updateHUD();

   setTimeout(()=>{
    if(running){
     spawnBot();
     $('message').textContent='';
    }
   },1300);
  }
 }
}

function knife(){
 if(!running)return;

 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);

 const objects=[];
 bots.forEach(b=>b.traverse(o=>{
  if(o.isMesh)objects.push(o);
 }));

 const hits=raycaster.intersectObjects(objects);

 if(hits.length && hits[0].distance<2.5){
  let target=hits[0].object;
  while(target.parent && !target.userData.isBot){
   target=target.parent;
  }

  if(target.userData.isBot){
   scene.remove(target);
   bots=bots.filter(b=>b!==target);
   kills++;
   score+=100;
   updateHUD();

   setTimeout(()=>{
    if(running)spawnBot();
   },1300);
  }
 }
}

function reload(){
 if(reloading || ammo===30 || reserve<=0)return;

 reloading=true;
 $('message').textContent='RELOADING...';

 setTimeout(()=>{
  let amount=Math.min(30-ammo,reserve);
  ammo+=amount;
  reserve-=amount;
  reloading=false;
  $('message').textContent='';
  updateHUD();
 },1300);
}

function jump(){
 if(onGround && running){
  velocityY=6;
  onGround=false;
 }
}

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(running){
  const forward=new THREE.Vector3(
   -Math.sin(yaw),0,-Math.cos(yaw)
  );
  const right=new THREE.Vector3(
   Math.cos(yaw),0,-Math.sin(yaw)
  );

  let mx=joyX;
  let mz=joyY;

  if(keys.KeyW)mz-=1;
  if(keys.KeyS)mz+=1;
  if(keys.KeyA)mx-=1;
  if(keys.KeyD)mx+=1;

  const move=new THREE.Vector3();
  move.addScaledVector(right,mx);
  move.addScaledVector(forward,-mz);

  if(move.length()>1)move.normalize();

  camera.position.addScaledVector(move,5*dt);

  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-18,18);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-18,18);

  velocityY-=15*dt;
  camera.position.y+=velocityY*dt;

  if(camera.position.y<1.7){
   camera.position.y=1.7;
   velocityY=0;
   onGround=true;
  }

  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
 }

 renderer.render(scene,camera);
}

function look(dx,dy){
 yaw-=dx*.004;
 pitch-=dy*.004;
 pitch=THREE.MathUtils.clamp(pitch,-1.3,1.3);
}

// Keyboard
window.addEventListener('keydown',e=>{
 keys[e.code]=true;

 if(e.code==='Space')jump();
 if(e.code==='KeyR')reload();
 if(e.code==='Digit1')shoot();
});

window.addEventListener('keyup',e=>{
 keys[e.code]=false;
});

// Desktop mouse
renderer?.domElement.addEventListener('click',()=>{
 if(running && !matchMedia('(pointer:coarse)').matches){
  renderer.domElement.requestPointerLock?.();
 }
});

document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement){
  look(e.movementX,e.movementY);
 }
});

document.addEventListener('mousedown',e=>{
 if(e.button===0 && running)shoot();
});

// Mobile look
let lookId=null,lastX=0,lastY=0;

$('lookArea').addEventListener('pointerdown',e=>{
 lookId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 $('lookArea').setPointerCapture(e.pointerId);
});

$('lookArea').addEventListener('pointermove',e=>{
 if(e.pointerId!==lookId)return;

 let dx=e.clientX-lastX;
 let dy=e.clientY-lastY;

 look(dx,dy);
 lastX=e.clientX;
 lastY=e.clientY;
});

$('lookArea').addEventListener('pointerup',()=>{
 lookId=null;
});

$('lookArea').addEventListener('pointercancel',()=>{
 lookId=null;
});

// Joystick
const joystick=$('joystick');
const stick=$('stick');

let joyId=null;

joystick.addEventListener('pointerdown',e=>{
 joyId=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 moveStick(e);
});

function moveStick(e){
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 let distance=Math.hypot(dx,dy);
 let max=42;

 if(distance>max){
  dx=dx/distance*max;
  dy=dy/distance*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joystick.addEventListener('pointermove',e=>{
 if(e.pointerId===joyId)moveStick(e);
});

function resetStick(){
 joyId=null;
 joyX=0;
 joyY=0;
 stick.style.transform='translate(0,0)';
}

joystick.addEventListener('pointerup',resetStick);
joystick.addEventListener('pointercancel',resetStick);

// Buttons
$('fire').addEventListener('pointerdown',e=>{
 e.preventDefault();
 shoot();
});

$('knife').addEventListener('pointerdown',e=>{
 e.preventDefault();
 knife();
});

$('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();
 jump();
});

$('reload').addEventListener('pointerdown',e=>{
 e.preventDefault();
 reload();
});

$('rifle').addEventListener('pointerdown',e=>{
 e.preventDefault();
 $('message').textContent='RIFLE SELECTED';
 setTimeout(()=> $('message').textContent='',1000);
});

// Start
$('start').addEventListener('click',()=>{
 $('menu').style.display='none';
 running=true;
 clock.getDelta();
});

window.addEventListener('resize',()=>{
 if(!camera || !renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

try{
 init();
}catch(e){
 $('menu').style.display='flex';
 $('menu').querySelector('p').textContent=
 'O‘yinni yuklashda xatolik. Internetni tekshiring va Chrome orqali qayta oching.';
 console.error(e);
}

</script>
</body>
</html>
